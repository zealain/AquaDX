services:
  app:
    build: .
    image: hykilpikonna/aquadx:latest
    ports:
      - "5170:80"
      - "5171:8443"
      - "22345:22345"
    restart: on-failure:3
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://db:3306/main
      - SPRING_DATASOURCE_USERNAME=cat
      - SPRING_DATASOURCE_PASSWORD=meow
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.mariadb.jdbc.Driver
    depends_on:
      - db
    volumes:
      - ./config:/app/config
      - ./data:/app/data
  db:
    image: mariadb:latest
    environment:
      MYSQL_ROOT_PASSWORD: meow
      MYSQL_DATABASE: main
      MYSQL_USER: cat
      MYSQL_PASSWORD: meow
    ports:
      - "${AQUADX_DB_PORT:-127.0.0.1:3369}:3306"
    volumes:
      - /opt/AquaDX/data/db:/var/lib/mysql"

